      discovery_rules:
        - uuid: 864dc774c19f49349b90eaa3f5163985
          name: 'Thread discover'
          type: DEPENDENT
          key: unbound.thread.discover
          item_prototypes:
            - uuid: f2edc2db510646a7a35bd035b04e428e
              name: 'Unbound: Thread {#THREAD.ID}: Cache hits per second'
              type: DEPENDENT
              key: 'unbound.thread.cache.hits[{#THREAD.ID}]'
              history: 7d
              value_type: FLOAT
              trends: 90d
              units: Qps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.threads.["{#THREAD.ID}"].cache_hits'
                - type: CHANGE_PER_SECOND
              master_item:
                key: unbound.metrics
              tags:
                - tag: application
                  value: unbound
                - tag: metric
                  value: cache
                - tag: scope
                  value: thread
                - tag: service
                  value: dns
                - tag: thread_id
                  value: '{#THREAD.ID}'
