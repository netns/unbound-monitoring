zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: e845874a3c314aefaa6c23d8b6c0bc4a
      template: 'Unbound by Zabbix Agent'
      name: 'Unbound by Zabbix Agent'
      description: |
        Unbound Monitoring Template for Zabbix
        
        Developed by Daniel Lima <contato@dnlima.dev.br>
        
        Copyright (c) 2026, Daniel Lima.
        Licensed under the BSD 2-Clause License.
        
        Repository: https://github.com/netns/unbound-monitoring
        License: https://github.com/netns/unbound-monitoring/blob/master/LICENSE
        
        Requirements:
        - Zabbix Agent
        - Unbound DNS resolver
        - Unbound statistics enabled
        
        Features:
        - Unbound statistics collection
        - DNS query and cache metrics
        - Recursive resolution statistics
        - Per-thread metrics discovery
        
        Documentation:
        See the project README for installation, configuration, and usage instructions.
      groups:
        - name: Templates/Applications
      items:
        - uuid: 04d1a9625a5240769dbf008bed4b0321
          name: 'Cache hits per second'
          type: DEPENDENT
          key: unbound.cache.hits
          history: 7d
          value_type: FLOAT
          trends: 90d
          units: Qps
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.["unbound.cache.hits"]'
            - type: CHANGE_PER_SECOND
          master_item:
            key: unbound.metrics
          tags:
            - tag: application
              value: unbound
            - tag: metric
              value: cache
            - tag: scope
              value: global
            - tag: service
              value: dns
        - uuid: f5837b4defee4f3cadcb40900cb4d28d
