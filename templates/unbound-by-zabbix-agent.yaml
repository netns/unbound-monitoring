          name: 'Total tracked memory'
          type: CALCULATED
          key: unbound.memory.cache.total
          delay: 30s
          history: 7d
          trends: 90d
          units: B
          params: |
            last(//unbound.memory.message_cache)
            +
            last(//unbound.memory.rrset_cache)
            +
            last(//unbound.memory.iterator)
            +
            last(//unbound.memory.validator)
