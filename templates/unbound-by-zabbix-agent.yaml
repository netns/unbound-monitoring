                  color: F63100
                  calc_fnc: ALL
                  item:
                    host: 'Unbound by Zabbix Agent'
                    key: 'unbound.thread.cache.misses[{#THREAD.ID}]'
                - sortorder: '2'
                  drawtype: BOLD_LINE
                  color: 2774A4
                  calc_fnc: ALL
                  item:
                    host: 'Unbound by Zabbix Agent'
                    key: 'unbound.thread.queries[{#THREAD.ID}]'
          master_item:
            key: unbound.metrics
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var result = [];
                  
                  Object.keys(data.threads).forEach(function (id) {
                      result.push({
                          "{#THREAD.ID}": id
                      });
                  });
                  
                  return JSON.stringify(result);
